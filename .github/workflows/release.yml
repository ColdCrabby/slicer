name: Release

# Tagging `vX.Y.Z` is the single trigger for a release. This workflow turns the
# tag into a published GitHub Release whose notes come straight from
# CHANGELOG.md, then builds and attaches artifacts for every target. See
# RELEASING.md for the full process.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Create the GitHub Release with notes from CHANGELOG.md ──────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if bash scripts/extract-changelog.sh "${{ steps.meta.outputs.version }}" > RELEASE_NOTES.md; then
            echo "Using CHANGELOG.md section for ${{ steps.meta.outputs.version }}"
          else
            echo "No CHANGELOG.md section found — falling back to auto-generated notes." | tee RELEASE_NOTES.md
          fi
          # Unsigned macOS bundles are quarantined on download ("damaged"); tell
          # users how to launch them. Skipped once a real Developer ID is set.
          if [[ -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "### 🍎 macOS"
              echo ""
              echo "This build is unsigned, so macOS Gatekeeper marks the downloaded app as \"damaged\". After moving **Slicer Engine Desktop** to Applications, clear the quarantine flag once to launch it:"
              echo ""
              echo '```bash'
              echo 'xattr -cr "/Applications/Slicer Engine Desktop.app"'
              echo '```'
            } >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md ${prerelease_flag}
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md ${prerelease_flag}
          fi

  # ── 2. Build the CLI/server binary for each desktop platform ───────────────
  binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Guarantee the baked-in version matches the tag even on shallow checkouts.
      SLICER_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin slicer-engine --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="slicer-engine-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/slicer-engine" "dist/${name}/"
          cp README.md CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "slicer-engine-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/slicer-engine.exe" "dist/$name/"
          Copy-Item README.md,CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber

  # ── 3. Build the Tauri desktop app for each platform ───────────────────────
  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      SLICER_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Add macOS universal build targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # ui-desktop/src-tauri is a *separate* Cargo workspace; cache both
          # target trees (and path-dep crates) so the desktop build reuses work.
          workspaces: |
            . -> target
            ui-desktop/src-tauri -> target
          cache-all-crates: "true"
          cache-on-failure: "true"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      # Prebuilt binary — compiling wasm-bindgen-cli from source cost minutes.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop bundle version with the tag
        shell: bash
        run: |
          # Windows MSI/WiX only accepts a numeric-only pre-release identifier,
          # so strip any `-rc.N` suffix for the *installer* version. The
          # user-facing version still comes from SLICER_VERSION at build time.
          version="${{ needs.create-release.outputs.version }}"
          bundle_version="${version%%-*}"
          node -e "const f='ui-desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n');" "${bundle_version}"

      - name: Generate WASM bindings and schemas
        run: pnpm run hydrate

      - name: Build desktop bundles
        shell: bash
        env:
          # Ad-hoc sign by default so the macOS .app launches (after
          # de-quarantine); switch to real Developer ID + notarization
          # automatically when these repo secrets are configured.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # One universal binary so the DMG runs on both Intel and Apple
            # Silicon (macos-latest runners are arm64-only otherwise).
            pnpm --filter slicer-ui-desktop exec tauri build --target universal-apple-darwin
          else
            pnpm --filter slicer-ui-desktop build
          fi

      - name: Upload desktop bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # macOS bundles land under the universal target triple; other OSes use
          # the default target dir. macOS ships bash 3.2 (no globstar), so
          # enumerate with find instead of a `**` glob.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bundle_dir="ui-desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          else
            bundle_dir="ui-desktop/src-tauri/target/release/bundle"
          fi
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find "$bundle_dir" -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \
          \))
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No desktop bundles found to upload." >&2
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
