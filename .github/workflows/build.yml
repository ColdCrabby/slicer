name: Multi-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose
      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc --verbose

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin --verbose
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin --verbose
      - name: Run tests
        run: cargo test --release --verbose

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.org/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web --release --dev
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wasm-artifacts
          path: pkg/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  quality:
    name: Slicing quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Slices the fixture corpus with both wall generators, measures the
      # G-code, checks invariants, and diffs against the committed baselines.
      # QA_REPORT=1 also captures per-stage geometry into target/qa/report.html.
      # Baselines are pinned to this job's platform+profile (ubuntu, debug), so
      # regenerate here — not on macOS — when a deliberate change moves them:
      #   UPDATE_QA_BASELINES=1 QA_FULL=1 cargo test --test slicing_quality -- --ignored
      - name: Run slicing quality gate
        run: QA_REPORT=1 cargo test --test slicing_quality -- --ignored --nocapture
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slicing-quality-report
          path: target/qa/
          if-no-files-found: warn
