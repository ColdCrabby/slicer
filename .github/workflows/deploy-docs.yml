name: Deploy Web Slicer + Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ui/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*.md"
      - "ui/**/*.md"
      - "*.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "build.rs"
      - "scripts/build-site.sh"
      - "scripts/seo/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup WASI SDK
        run: |
          curl -L -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz
          echo "WASI_SDK_PATH=${GITHUB_WORKSPACE}/wasi-sdk-33.0-x86_64-linux" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/wasi-sdk-33.0-x86_64-linux/bin" >> "${GITHUB_PATH}"

      - name: Install wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same build the pull-request previews publish — see pr-preview.yml.
      - name: Build the site
        env:
          # Pin the baked-in commit SHA so it exactly matches version.json,
          # letting a stale tab detect that a newer build has been deployed.
          SLICER_GIT_SHA: ${{ github.sha }}
          SLICER_DEPLOY_REF: ${{ github.ref_name }}
          # The one build that gets canonical URLs, a sitemap and social cards.
          # Previews and self-hosted servers never set it — see build-site.sh.
          SLICER_SITE_URL: https://slicer.maxscopp.de
        run: bash scripts/build-site.sh _site

      # Deploy gate: a failing UI unit test must block the production Pages
      # publish, even on a direct push to main that skipped PR checks. Skip
      # cleanly until the repo has its first spec (the builder errors on an
      # empty match).
      - name: Unit tests (deploy gate)
        run: |
          if find ui/src \( -name '*.spec.ts' -o -name '*.test.ts' \) -print -quit | grep -q .; then
            pnpm --filter slicer-ui exec ng test --watch=false
          else
            echo "No UI unit tests (*.spec.ts / *.test.ts) found — skipping."
          fi

      - name: GitHub Pages touches
        run: |
          touch _site/.nojekyll
          # SPA fallback: GitHub Pages returns 404.html (with the request URL
          # preserved) for any path it can't resolve to a static file. Serving
          # the Angular shell there lets the client-side router handle deep
          # links on hard reload instead of showing a 404. base-href is "/",
          # so index.html works unchanged as the fallback.
          cp _site/index.html _site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
