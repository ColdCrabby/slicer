name: Canary

# Every push to the default branch (i.e. every merge) refreshes a single rolling
# "canary" pre-release so the latest Windows and macOS desktop bundles are always
# one click away in the Releases tab. This is deliberately *not* a real release:
# the version is a throwaway pre-release string, the notes are just the commit
# range since the last tag, and everything here is overwritten on the next push.
# Cutting an actual versioned release stays tag-driven — see release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one canary build at a time; a newer push supersedes an in-flight one so
# the rolling release always reflects the tip of main.
concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CANARY_TAG: canary

jobs:
  # ── 1. Refresh the rolling "canary" pre-release ────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive canary version
        id: meta
        run: |
          base="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          version="${base}-canary.${{ github.run_number }}+${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Canary version: ${version}"

      - name: Build release notes from the commit range
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "${last_tag}" ]]; then
            range="${last_tag}..HEAD"
            echo "Commits since \`${last_tag}\`:" > NOTES.md
          else
            range="HEAD"
            echo "Recent commits:" > NOTES.md
          fi
          {
            echo ""
            echo "> ⚠️ **Canary build** — automatically produced from the tip of"
            echo "> \`main\` (\`${GITHUB_SHA::7}\`) on every merge. Unstable and"
            echo "> overwritten on every push. For a stable build use a tagged release."
            echo ""
            echo "> 🍎 **macOS:** this build is unsigned, so Gatekeeper marks the"
            echo "> downloaded app as \"damaged\". After moving it to Applications,"
            echo "> clear the quarantine flag once to launch it —"
            echo "> \`xattr -cr \"/Applications/Slicer Engine Desktop.app\"\`"
            echo ""
            git log --no-merges --format='- %s (%h)' ${range} | head -n 50
          } >> NOTES.md
          cat NOTES.md

      - name: Refresh the canary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Canary (${{ steps.meta.outputs.version }})"
          if gh release view "${CANARY_TAG}" >/dev/null 2>&1; then
            # Move the rolling tag to this commit, refresh notes, and clear the
            # stale bundles so only the current build's assets remain.
            gh release edit "${CANARY_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file NOTES.md \
              --prerelease
            for asset in $(gh release view "${CANARY_TAG}" --json assets -q '.assets[].name'); do
              gh release delete-asset "${CANARY_TAG}" "${asset}" --yes || true
            done
          else
            gh release create "${CANARY_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file NOTES.md \
              --prerelease
          fi

  # ── 2. Build the Tauri desktop app for Windows and macOS ───────────────────
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Bake the canary version into the binaries even on a shallow checkout.
      SLICER_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Add macOS universal build targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # The desktop app is a *separate* Cargo workspace; its target dir was
          # never cached, so the whole engine recompiled from scratch every run.
          # Cache both trees (and path-dep crates) so warm runs are minutes faster.
          workspaces: |
            . -> target
            ui-desktop/src-tauri -> target
          cache-all-crates: "true"
          cache-on-failure: "true"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Prebuilt binary — compiling wasm-bindgen-cli from source cost minutes.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop bundle version with the canary version
        shell: bash
        run: |
          # Windows MSI/WiX rejects a non-numeric pre-release identifier
          # ("canary") and caps it at 65535, so the throwaway canary string
          # cannot be the *installer* version. Derive a numeric-only
          # `X.Y.Z-<run>` for bundle metadata; the user-facing version still
          # comes from SLICER_VERSION baked in at build time.
          version="${{ needs.prepare.outputs.version }}"
          base="${version%%-*}"
          bundle_version="${base}-$(( ${{ github.run_number }} % 65536 ))"
          node -e "const f='ui-desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n');" "${bundle_version}"

      - name: Generate WASM bindings and schemas
        run: pnpm run hydrate

      - name: Build desktop bundles
        shell: bash
        env:
          # Ad-hoc sign by default so the .app carries a valid signature and
          # launches (after de-quarantine) on Apple Silicon; switch to a real
          # Developer ID + notarization automatically when these repo secrets
          # are configured.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # One universal binary so the DMG runs on both Intel and Apple
            # Silicon (macos-latest runners are arm64-only otherwise).
            pnpm --filter slicer-ui-desktop exec tauri build --target universal-apple-darwin
          else
            pnpm --filter slicer-ui-desktop build
          fi

      - name: Upload desktop bundles to the canary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # macOS bundles land under the universal target triple; other OSes use
          # the default target dir. macOS ships bash 3.2 (no globstar), so
          # enumerate with find instead of a `**` glob.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bundle_dir="ui-desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          else
            bundle_dir="ui-desktop/src-tauri/target/release/bundle"
          fi
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find "$bundle_dir" -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' \
          \))
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No desktop bundles found to upload." >&2
            exit 1
          fi
          gh release upload "${CANARY_TAG}" "${assets[@]}" --clobber
