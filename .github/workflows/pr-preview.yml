name: PR preview

# Every pull request gets its own copy of the static site — the web slicer and
# the docs, exactly as deploy-docs.yml would publish them to GitHub Pages from
# main — at a stable address on Cloudflare Pages, so a change can be tried in a
# browser before it merges. The address is posted on the pull request and
# shown as its deployment; closing the pull request takes the preview down.
#
# Needs two repository secrets, CLOUDFLARE_API_TOKEN (with "Cloudflare Pages:
# Edit") and CLOUDFLARE_ACCOUNT_ID, and optionally the repository variable
# CLOUDFLARE_PAGES_PROJECT to name the Pages project. Without the secrets the
# workflow skips instead of failing. Pull requests from forks get no preview:
# their workflows never see secrets, and handing them to fork code would be
# unsafe.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - "ui/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "build.rs"
      - "scripts/build-site.sh"
      - ".github/workflows/pr-preview.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to (re)deploy
        required: true

# One preview build per pull request; a newer push supersedes an older one.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'coldcrabby-slicer' }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  # ── Decide whether this pull request gets a preview ────────────────────────
  gate:
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Check the Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::notice::No Cloudflare credentials configured — skipping the preview. See RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build the site and publish it under the pull request's own alias ───────
  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pr-preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The commit the author pushed (not GitHub's merge preview), so the
          # hash in the comment is one they recognise.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Setup WASI SDK
        run: |
          curl -L -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz
          echo "WASI_SDK_PATH=${GITHUB_WORKSPACE}/wasi-sdk-33.0-x86_64-linux" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/wasi-sdk-33.0-x86_64-linux/bin" >> "${GITHUB_PATH}"

      # Prebuilt binary, pinned to the wasm-bindgen version in Cargo.toml.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same build GitHub Pages publishes from main.
      - name: Build the site
        id: build
        env:
          SLICER_DEPLOY_REF: pr-${{ env.PR_NUMBER }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          SLICER_GIT_SHA="${sha}" bash scripts/build-site.sh _site
          # No 404.html: Cloudflare Pages then serves index.html for any path
          # it cannot resolve, which is the SPA fallback the router needs.

      - name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          if curl -fsS -o /dev/null -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${PAGES_PROJECT}"; then
            echo "Pages project ${PAGES_PROJECT} exists."
          else
            echo "Creating Pages project ${PAGES_PROJECT}."
            curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
              "${api}" > /dev/null
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `pr-<n>` gives each pull request a stable alias that every push
          # updates in place: https://pr-<n>.<project>.pages.dev
          command: >-
            pages deploy _site
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=pr-${{ env.PR_NUMBER }}
            --commit-hash=${{ steps.build.outputs.sha }}
            --commit-dirty=true

      - name: Post the address on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          url="${ALIAS_URL:-${DEPLOY_URL}}"
          marker="<!-- pr-preview -->"
          body="$(printf '%s\n**Preview:** %s — the web slicer, with the docs at [/docs/](%s/docs/).\n\nBuilt from `%s`; every push updates it, and it is taken down when this pull request closes. Pinned to this exact commit: %s\n' \
            "${marker}" "${url}" "${url}" "${SHA::7}" "${DEPLOY_URL}")"
          # One comment per pull request, edited in place on every push.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\")) | .id] | first // empty")"
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" > /dev/null
          fi

  # ── Take the preview down when the pull request closes ─────────────────────
  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the pull request's deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "No Cloudflare credentials configured — nothing to clean up."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          branch="pr-${PR_NUMBER}"
          # Collect every id first: deleting while paging would shift the pages.
          ids=()
          page=1
          while :; do
            resp="$(curl -fsS "${auth[@]}" "${api}?env=preview&page=${page}&per_page=25")"
            while IFS= read -r id; do
              [[ -n "${id}" ]] && ids+=("${id}")
            done < <(jq -r --arg b "${branch}" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"${resp}")
            total_pages="$(jq -r '.result_info.total_pages // 1' <<<"${resp}")"
            [[ "${page}" -ge "${total_pages}" ]] && break
            page=$((page + 1))
          done
          deleted=0
          for id in "${ids[@]}"; do
            if curl -fsS -X DELETE "${auth[@]}" "${api}/${id}?force=true" > /dev/null; then
              deleted=$((deleted + 1))
            fi
          done
          echo "Deleted ${deleted} deployment(s) for ${branch}."
