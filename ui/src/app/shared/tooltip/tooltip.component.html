@if (mode() === 'block') {
  <div class="tooltip-panel tooltip-panel--block" [class.tooltip-panel--persistent]="persistent()">
    <div class="tooltip-panel__content">
      <markdown class="tooltip-markdown" [data]="text()" />
    </div>
    @if (shortcut() || persistent()) {
      <div class="tooltip-panel__meta">
        @if (shortcut()) {
          <kbd class="tooltip-shortcut">{{ shortcut() }}</kbd>
        }
        @if (persistent()) {
          <span class="tooltip-hint">Press Esc to close</span>
        }
      </div>
    }
  </div>
} @else {
  <span
    class="tooltip-panel tooltip-panel--inline"
    [class.tooltip-panel--persistent]="persistent()"
  >
    <span class="tooltip-inline-text">{{ text() }}</span>
    @if (shortcut()) {
      <kbd class="tooltip-shortcut">{{ shortcut() }}</kbd>
    }
  </span>
}
