<div
  class="slice-viewer-page"
  [class.drag-active]="dragActive()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <div class="viewport-area">
    <div class="viewport-container">
      <nexus-viewer
        [mode]="viewerMode()"
        [model]="modelFile()"
        [modelSourceId]="modelSourceId()"
        (loadComplete)="onViewerLoadComplete($event)"
      ></nexus-viewer>
    </div>
  </div>

  <!--
    Someone else changed this plate. A prompt rather than a reload: two people
    on one plate is ordinary, and taking the scene away from whoever typed
    second is worse than letting them choose the moment.
  -->
  @if (changedElsewhere(); as change) {
    <div class="plate-changed" role="status" aria-live="polite">
      <nexus-icon class="plate-changed__icon" name="cloud" />
      <span class="plate-changed__text">This workplate was changed elsewhere.</span>
      <button type="button" class="plate-changed__action" (click)="refreshPlate(change.uuid)">
        Reload plate
      </button>
      <button
        nexusIconButton
        size="sm"
        type="button"
        aria-label="Keep working on my version"
        tooltip="Keep mine"
        (click)="keepMine()"
      >
        <nexus-icon name="xmark" />
      </button>
    </div>
  }

  @if (restoring()) {
    <div class="drop-overlay restore-overlay" aria-live="polite">
      <div class="drop-card">
        <nexus-icon name="refresh-double"></nexus-icon>
        <p class="drop-title">Opening workplate…</p>
        <p class="drop-hint">Putting the models back where you left them</p>
      </div>
    </div>
  }

  @if (dragActive()) {
    <div class="drop-overlay" aria-hidden="true">
      <div class="drop-card">
        <nexus-icon name="page-plus"></nexus-icon>
        <p class="drop-title">Add to this plate</p>
        <p class="drop-hint">Drop STL, OBJ or 3MF models</p>
      </div>
    </div>
  }
</div>
