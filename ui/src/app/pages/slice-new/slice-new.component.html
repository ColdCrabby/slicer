<div
  class="scene-shell"
  [class.is-drag-active]="dragActive()"
  [class.is-busy]="uploading() || slicerFile.isPending()"
  (click)="triggerFilePicker()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <nexus-viewer class="scene-canvas" mode="model"></nexus-viewer>

  <div class="drop-aurora" [class.is-active]="dragActive()" aria-hidden="true">
    <span class="aurora-orb aurora-orb--a"><span class="aurora-blob"></span></span>
    <span class="aurora-orb aurora-orb--b"><span class="aurora-blob"></span></span>
    <span class="aurora-orb aurora-orb--c"><span class="aurora-blob"></span></span>
  </div>

  <input
    #fileInput
    type="file"
    accept=".stl,.obj,.3mf,model/stl,model/obj,model/3mf,application/vnd.ms-pki.stl,application/sla,application/vnd.ms-package.3dmanufacturing-3dmodel+xml,application/octet-stream"
    (change)="onFileSelected($event)"
    class="file-input-hidden"
    [disabled]="uploading() || slicerFile.isPending()"
  />

  <div class="launch-overlay">
    @if (uploading()) {
      <div class="launch-card">
        <nexus-empty-state
          class="launch-empty"
          icon="cloud-upload"
          heading="Uploading model..."
          [description]="slicerFile.uploadProgress() + '%'"
        >
          <div class="progress-track">
            <div class="progress-fill" [style.width.%]="slicerFile.uploadProgress()"></div>
          </div>
        </nexus-empty-state>
      </div>
    } @else if (slicerFile.isPending()) {
      <div class="launch-card">
        <nexus-empty-state
          class="launch-empty"
          icon="cloud-upload"
          heading="Preparing workplate..."
          [description]="slicerFile.selectedFile()!.name"
        >
          <div class="progress-track">
            <div class="progress-fill indeterminate"></div>
          </div>
        </nexus-empty-state>
      </div>
    } @else if (slicerFile.uploadError()) {
      <div class="launch-card is-error">
        <nexus-empty-state
          class="launch-empty"
          icon="warning-triangle"
          heading="Upload failed"
          [description]="slicerFile.uploadError() ?? undefined"
        >
          <button class="browse-btn" type="button" (click)="triggerFilePicker($event)">
            Try again
          </button>
        </nexus-empty-state>
      </div>
    } @else {
      <div class="launch-card" [class.is-drag-active]="dragActive()">
        <nexus-empty-state
          class="launch-empty"
          icon="cloud-upload"
          [heading]="dragActive() ? 'Release to place on bed' : 'Start your first plate'"
          [description]="
            dragActive() ? 'Drop to start this workplate' : 'Drop STL, OBJ, or 3MF - up to 500 MB'
          "
        >
          <div class="launch-actions">
            <button class="browse-btn" type="button" (click)="triggerFilePicker($event)">
              Browse files
            </button>
            @if (invalidDropMessage()) {
              <p class="error-msg">{{ invalidDropMessage() }}</p>
            }
            <div class="meta-footer" aria-hidden="true">
              <span class="meta-item">Bed {{ bedLabel() }}</span>
              <span class="meta-sep">·</span>
              <span class="meta-item">Auto-oriented and dropped to the bed</span>
            </div>
          </div>
        </nexus-empty-state>
      </div>
    }
  </div>
</div>
