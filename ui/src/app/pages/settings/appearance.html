<div class="settings-page">
  <nexus-section-header heading="Appearance" description="Theme, accent colour and colour picker" />

  <section class="pref-group" aria-labelledby="appearance-look">
    <h2 class="pref-group__title" id="appearance-look">Look</h2>
    <div class="settings-card">
      <nexus-pref-row pref="theme">
        <nexus-segmented
          label="Theme"
          [options]="themeModes"
          [value]="themeMode()"
          (valueChange)="setTheme($event)"
        />
      </nexus-pref-row>

      <nexus-pref-row pref="accent" [hint]="accentHint()">
        <div class="accent-swatches" role="group" aria-label="Accent colour">
          <button
            type="button"
            class="accent-swatch accent-swatch--brand"
            [class.is-active]="accent.source() === 'brand'"
            [attr.aria-pressed]="accent.source() === 'brand'"
            aria-label="Brand"
            tooltip="Brand"
            (click)="setAccentSource('brand')"
          ></button>
          @if (accent.isDesktop) {
            <button
              type="button"
              class="accent-swatch accent-swatch--system"
              [class.is-active]="accent.source() === 'system'"
              [attr.aria-pressed]="accent.source() === 'system'"
              aria-label="Match system"
              tooltip="Match system"
              (click)="setAccentSource('system')"
            ></button>
          }
          <span class="accent-swatches__divider" aria-hidden="true"></span>
          @for (preset of presets; track preset.hex) {
            <button
              type="button"
              class="accent-swatch"
              [class.is-active]="currentPreset() === preset.hex"
              [style.--swatch]="preset.hex"
              [attr.aria-label]="preset.name"
              [attr.aria-pressed]="currentPreset() === preset.hex"
              [tooltip]="preset.name"
              (click)="setPreset(preset.hex)"
            ></button>
          }
        </div>
      </nexus-pref-row>
    </div>
  </section>

  <section class="pref-group" aria-labelledby="appearance-picker">
    <h2 class="pref-group__title" id="appearance-picker">Colour picker</h2>
    <div class="settings-card">
      <nexus-pref-row pref="color-picker" [hint]="colorPickerHint()">
        <nexus-segmented
          label="Colour picker"
          [options]="colorPickerModes"
          [value]="colorPicker.mode()"
          (valueChange)="setColorPicker($event)"
        />
      </nexus-pref-row>
    </div>
  </section>
</div>
