<div class="settings-page">
  <nexus-section-header heading="General" description="Slicing, your library, and this build" />

  <section class="pref-group" aria-labelledby="general-slicing">
    <h2 class="pref-group__title" id="general-slicing">Slicing</h2>
    <div class="settings-card">
      <nexus-pref-row pref="auto-slice" [hint]="autoSliceNote()">
        <nexus-segmented
          label="Re-slice after a change"
          [options]="autoSliceOptions"
          [value]="autoSlice.mode()"
          (valueChange)="setAutoSlice($event)"
        />
      </nexus-pref-row>
      <nexus-pref-row pref="preview-follow">
        <nexus-segmented
          label="Show the preview after slicing"
          [options]="previewFollowOptions"
          [value]="previewFollow()"
          (valueChange)="setPreviewFollow($event)"
        />
      </nexus-pref-row>
    </div>
  </section>

  <section class="pref-group" aria-labelledby="general-panels">
    <h2 class="pref-group__title" id="general-panels">Settings panels</h2>
    <div class="settings-card">
      <nexus-pref-row pref="settings-detail">
        <nexus-segmented
          label="Settings detail"
          [options]="settingsDetailOptions"
          [value]="settingsDetail.mode()"
          (valueChange)="setSettingsDetail($event)"
        />
      </nexus-pref-row>
    </div>
  </section>

  <section class="pref-group" aria-labelledby="general-library">
    <h2 class="pref-group__title" id="general-library">Your library</h2>
    <div class="settings-card">
      <nexus-pref-row pref="library-storage" [hint]="storage.text">
        <span class="storage-badge" [attr.data-mode]="storage.mode">
          <nexus-icon [name]="storage.icon" aria-hidden="true" />
          {{ storage.title }}
        </span>
      </nexus-pref-row>
      <nexus-pref-row pref="library-export" [hint]="exportHint">
        <nexus-profile-export-button />
      </nexus-pref-row>
    </div>
  </section>

  <section class="pref-group" aria-labelledby="general-about">
    <h2 class="pref-group__title" id="general-about">About</h2>
    <div class="settings-card">
      <nexus-pref-row pref="about-version" [hint]="aboutLine()">
        <span class="settings-version">
          @if (commit()) {
            <a
              class="settings-value settings-value-mono"
              [href]="commitUrl()"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="'Commit ' + shortCommit() + ' on GitHub'"
            >
              {{ shortCommit() }}
            </a>
          }
          <a nexusButton variant="ghost" size="sm" routerLink="/settings/changelog"> What's new </a>
        </span>
      </nexus-pref-row>
    </div>
  </section>
</div>
