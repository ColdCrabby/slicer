@if (preview.gcodeHandle() !== null) {
  <div class="segment-bar" (pointerdown)="$event.stopPropagation()">
    <!-- ── View-mode selector ── -->
    <div class="mode-row">
      <label class="mode-label" for="gcode-view-mode">Color by</label>
      <select
        id="gcode-view-mode"
        class="mode-select"
        [value]="preview.viewMode()"
        (change)="onModeChange($event)"
      >
        @for (mode of viewModes(); track mode) {
          <option [value]="mode">{{ viewModeLabels[mode] }}</option>
        }
      </select>
    </div>

    @if (showFanSelector()) {
      <!-- ── Fan sub-selector (multi-fan printers) ── -->
      <div class="mode-row">
        <label class="mode-label" for="gcode-fan-select">Fan</label>
        <select
          id="gcode-fan-select"
          class="mode-select"
          [value]="preview.selectedFan()"
          (change)="onFanChange($event)"
        >
          @for (fan of fans(); track fan.key) {
            <option [value]="fan.key">{{ fan.label }}</option>
          }
        </select>
      </div>
    }

    <!-- ── Nozzle / segment scrub ── -->
    <div class="scrub-row">
      <span class="scrub-label">Layer progress</span>
      <div class="range-slider" (wheel)="onWheelSegment($event)">
        <div class="range-track-fill" [style.right.%]="scrubFillRight()"></div>
        <input
          type="range"
          class="thumb"
          min="0"
          [max]="layerSegmentCount()"
          [value]="segmentSliderValue()"
          (input)="onSegmentInput($event)"
        />
      </div>
    </div>

    @if (activeChannel(); as channel) {
      <!-- ── Scalar legend ── -->
      <div class="scalar-legend">
        <span class="scalar-label">{{ scalarMinLabel() }}</span>
        <div class="scalar-gradient" [style.background]="scalarGradient"></div>
        <span class="scalar-label">{{ scalarMaxLabel() }}</span>
      </div>
    } @else {
      <!-- ── Role legend ── -->
      <div class="legend">
        @for (role of roleOrder; track role) {
          <button
            type="button"
            class="role-badge"
            [class.hidden]="preview.hiddenRoles().has(role)"
            [style.--role-color]="roleCss()[role]"
            (click)="toggleRole(role)"
            [title]="(preview.hiddenRoles().has(role) ? 'Show ' : 'Hide ') + roleLabels[role]"
          >
            <span class="role-swatch"></span>
            <span class="role-name">{{ roleLabels[role] }}</span>
          </button>
        }
      </div>
    }
  </div>
}
