@if (history.loadState() === 'pending') {
  <p class="lh-empty">Loading…</p>
} @else if (history.isEmpty()) {
  <p class="lh-empty">No sliced projects yet. Slice a model and it'll show up here.</p>
} @else {
  <ul class="lh-list">
    @for (session of history.sessions(); track session.request_uuid) {
      <li class="lh-item" (contextmenu)="onContextMenu($event, session)">
        <button
          class="lh-open"
          type="button"
          (click)="navigate(session)"
          [title]="'Open ' + displayName(session)"
        >
          <span class="lh-icon"><nexus-icon name="box-iso" /></span>
          <span class="lh-text">
            <span class="lh-name">{{ displayName(session) }}</span>
            <span class="lh-date">{{ history.formatDate(session.created_at) }}</span>
          </span>
        </button>
        <button nexusButton variant="secondary" size="sm" (click)="download(session)">
          <nexus-icon name="download" />
          Download
        </button>
      </li>
    }
  </ul>
}
