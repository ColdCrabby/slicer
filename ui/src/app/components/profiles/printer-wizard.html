<nexus-wizard-shell
  title="Add printer"
  [steps]="steps"
  [index]="index()"
  [canProceed]="canProceed()"
  finishLabel="Add printer"
  (back)="back()"
  (next)="next()"
  (finish)="finish()"
  (cancel)="cancelled.emit()"
>
  @switch (index()) {
    @case (0) {
      <div class="wz-step">
        <p class="wz-intro">
          Start from a manufacturer preset in the cloud catalog, or set one up from scratch.
        </p>
        <div class="wz-start">
          <button type="button" class="wz-start__scratch" (click)="startFromScratch()">
            <nexus-icon name="grid-plus" />
            <span>
              <strong>Start from scratch</strong>
              <small>A blank 220 mm printer you can fully customise</small>
            </span>
          </button>

          <div class="wz-start__divider">or pick a preset</div>

          <nexus-catalog-picker
            [entries]="catalogEntries()"
            [loading]="catalogStatus() === 'loading'"
            [unavailable]="catalogStatus() === 'unavailable'"
            actionLabel="Use preset"
            (pick)="startFromCatalog($event)"
            (retry)="retryCatalog()"
          />
        </div>
      </div>
    }

    @case (1) {
      <div class="wz-step">
        <div class="wz-group">
          <label class="wz-group__title">Name</label>
          <input class="wz-input" [value]="draft().name" (input)="patchName($event)" />
        </div>
        <nexus-field-row label="Vendor" [stacked]="true">
          <input class="wz-input" [value]="draft().vendor" (input)="patchVendor($event)" />
        </nexus-field-row>
        <nexus-field-row label="Model" [stacked]="true">
          <input class="wz-input" [value]="draft().model" (input)="patchModel($event)" />
        </nexus-field-row>
        <nexus-field-row label="Firmware" description="G-code dialect the printer speaks">
          <nexus-select
            [options]="flavorOptions"
            [value]="draft().gcodeFlavor"
            (valueChange)="setFlavor($event)"
          />
        </nexus-field-row>
      </div>
    }

    @case (2) {
      <div class="wz-step">
        <nexus-field-row label="Bed shape">
          <nexus-segmented
            [options]="bedShapeOptions"
            [value]="draft().bedShape"
            (valueChange)="setBedShape($event)"
          />
        </nexus-field-row>
        <nexus-field-row [label]="draft().bedShape === 'circular' ? 'Diameter' : 'Width (X)'">
          <nexus-number-input
            [value]="draft().bedWidth"
            [min]="20"
            [max]="1000"
            unit="mm"
            (valueChange)="patch({ bedWidth: $event })"
          />
        </nexus-field-row>
        @if (draft().bedShape === 'rectangular') {
          <nexus-field-row label="Depth (Y)">
            <nexus-number-input
              [value]="draft().bedDepth"
              [min]="20"
              [max]="1000"
              unit="mm"
              (valueChange)="patch({ bedDepth: $event })"
            />
          </nexus-field-row>
        }
        <nexus-field-row label="Height (Z)">
          <nexus-number-input
            [value]="draft().bedHeight"
            [min]="20"
            [max]="1000"
            unit="mm"
            (valueChange)="patch({ bedHeight: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Origin at center" description="Delta / center-origin machines">
          <nexus-switch
            [checked]="draft().originAtCenter"
            (checkedChange)="patch({ originAtCenter: $event })"
          />
        </nexus-field-row>
      </div>
    }

    @case (3) {
      <div class="wz-step">
        <div class="wz-group">
          <label class="wz-group__title">Toolhead</label>
        </div>
        <nexus-field-row label="Nozzle diameter">
          <nexus-number-input
            [value]="draft().nozzleDiameter"
            [min]="0.1"
            [max]="2"
            [step]="0.05"
            unit="mm"
            (valueChange)="patch({ nozzleDiameter: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Filament diameter">
          <nexus-number-input
            [value]="draft().filamentDiameter"
            [min]="1"
            [max]="4"
            [step]="0.05"
            unit="mm"
            (valueChange)="patch({ filamentDiameter: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Max print speed">
          <nexus-number-input
            [value]="draft().maxPrintSpeed"
            [min]="10"
            [max]="1000"
            [step]="5"
            unit="mm/s"
            (valueChange)="patch({ maxPrintSpeed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Max travel speed">
          <nexus-number-input
            [value]="draft().maxTravelSpeed"
            [min]="10"
            [max]="1000"
            [step]="5"
            unit="mm/s"
            (valueChange)="patch({ maxTravelSpeed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Retraction length">
          <nexus-number-input
            [value]="draft().retractionLength"
            [min]="0"
            [max]="10"
            [step]="0.1"
            unit="mm"
            (valueChange)="patch({ retractionLength: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Z-hop">
          <nexus-number-input
            [value]="draft().zHop"
            [min]="0"
            [max]="5"
            [step]="0.05"
            unit="mm"
            (valueChange)="patch({ zHop: $event })"
          />
        </nexus-field-row>
      </div>
    }
  }
</nexus-wizard-shell>
