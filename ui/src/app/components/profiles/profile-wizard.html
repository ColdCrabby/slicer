<nexus-wizard-shell
  title="Add print profile"
  [steps]="steps"
  [index]="index()"
  [canProceed]="canProceed()"
  finishLabel="Add profile"
  (back)="back()"
  (next)="next()"
  (finish)="finish()"
  (cancel)="cancelled.emit()"
>
  @switch (index()) {
    @case (0) {
      <div class="wz-step">
        <p class="wz-intro">
          Import a tuned quality preset from the cloud catalog, or start from a balanced standard
          profile.
        </p>
        <div class="wz-start">
          <button type="button" class="wz-start__scratch" (click)="startFromScratch()">
            <nexus-icon name="grid-plus" />
            <span>
              <strong>Start from scratch</strong>
              <small>Standard 0.20 mm you can refine</small>
            </span>
          </button>

          <div class="wz-start__divider">or pick a preset</div>

          <nexus-catalog-picker
            [entries]="catalogEntries()"
            [loading]="catalogStatus() === 'loading'"
            [unavailable]="catalogStatus() === 'unavailable'"
            actionLabel="Use preset"
            (pick)="startFromCatalog($event)"
            (retry)="retryCatalog()"
          />
        </div>
      </div>
    }

    @case (1) {
      <div class="wz-step">
        <div class="wz-group">
          <label class="wz-group__title">Name</label>
          <input class="wz-input" [value]="draft().name" (input)="patchName($event)" />
        </div>
        <nexus-field-row label="Quality">
          <nexus-segmented
            [options]="qualityOptions"
            [value]="draft().quality ?? 'standard'"
            (valueChange)="setQuality($event)"
          />
        </nexus-field-row>
        <nexus-field-row label="Layer height">
          <nexus-number-input
            [value]="pnum(draft().params, 'layer_height')"
            [min]="0.04"
            [max]="1"
            [step]="0.02"
            unit="mm"
            (valueChange)="patchParams({ layer_height: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="First layer height">
          <nexus-number-input
            [value]="pnum(draft().params, 'first_layer_height')"
            [min]="0.04"
            [max]="1"
            [step]="0.02"
            unit="mm"
            (valueChange)="patchParams({ first_layer_height: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Walls (perimeters)">
          <nexus-number-input
            [value]="pnum(draft().params, 'wall_count')"
            [min]="1"
            [max]="10"
            (valueChange)="patchParams({ wall_count: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Top layers">
          <nexus-number-input
            [value]="pnum(draft().params, 'top_layers')"
            [min]="0"
            [max]="20"
            (valueChange)="patchParams({ top_layers: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Bottom layers">
          <nexus-number-input
            [value]="pnum(draft().params, 'bottom_layers')"
            [min]="0"
            [max]="20"
            (valueChange)="patchParams({ bottom_layers: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Seam position">
          <nexus-select
            [options]="seamOptions"
            [value]="pstr(draft().params, 'seam_position')"
            (valueChange)="setSeam($event)"
          />
        </nexus-field-row>
      </div>
    }

    @case (2) {
      <div class="wz-step">
        <nexus-field-row label="Infill density">
          <nexus-number-input
            [value]="infillPercent()"
            [min]="0"
            [max]="100"
            [step]="5"
            unit="%"
            (valueChange)="setInfillPercent($event)"
          />
        </nexus-field-row>
        <nexus-field-row label="Infill pattern">
          <nexus-select
            [options]="patternOptions"
            [value]="pstr(draft().params, 'infill_pattern')"
            (valueChange)="setPattern($event)"
          />
        </nexus-field-row>
        <nexus-field-row label="Infill angle">
          <nexus-number-input
            [value]="pnum(draft().params, 'infill_base_angle')"
            [min]="0"
            [max]="90"
            [step]="5"
            unit="°"
            (valueChange)="patchParams({ infill_base_angle: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Ironing" description="Smooth top surfaces with a light pass">
          <nexus-switch
            [checked]="pbool(draft().params, 'ironing_enabled')"
            (checkedChange)="patchParams({ ironing_enabled: $event })"
          />
        </nexus-field-row>
      </div>
    }

    @case (3) {
      <div class="wz-step">
        <nexus-field-row label="Print speed">
          <nexus-number-input
            [value]="pnum(draft().params, 'print_speed')"
            [min]="5"
            [max]="1000"
            [step]="5"
            unit="mm/s"
            (valueChange)="patchParams({ print_speed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Wall speed">
          <nexus-number-input
            [value]="pnum(draft().params, 'perimeter_speed')"
            [min]="5"
            [max]="1000"
            [step]="5"
            unit="mm/s"
            (valueChange)="patchParams({ perimeter_speed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Infill speed">
          <nexus-number-input
            [value]="pnum(draft().params, 'infill_speed')"
            [min]="5"
            [max]="1000"
            [step]="5"
            unit="mm/s"
            (valueChange)="patchParams({ infill_speed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="First layer speed">
          <nexus-number-input
            [value]="pnum(draft().params, 'first_layer_speed')"
            [min]="5"
            [max]="200"
            [step]="1"
            unit="mm/s"
            (valueChange)="patchParams({ first_layer_speed: $event })"
          />
        </nexus-field-row>
        <nexus-field-row label="Supports" description="Generate support for overhangs">
          <nexus-switch
            [checked]="pbool(draft().params, 'support_enabled')"
            (checkedChange)="patchParams({ support_enabled: $event })"
          />
        </nexus-field-row>
        @if (pbool(draft().params, 'support_enabled')) {
          <nexus-field-row label="Overhang threshold">
            <nexus-number-input
              [value]="pnum(draft().params, 'support_threshold_angle')"
              [min]="0"
              [max]="90"
              [step]="1"
              unit="°"
              (valueChange)="patchParams({ support_threshold_angle: $event })"
            />
          </nexus-field-row>
        }
        <nexus-field-row label="Bed adhesion">
          <nexus-select
            [options]="adhesionOptions"
            [value]="pstr(draft().params, 'adhesion_type')"
            (valueChange)="setAdhesion($event)"
          />
        </nexus-field-row>
      </div>
    }
  }
</nexus-wizard-shell>
