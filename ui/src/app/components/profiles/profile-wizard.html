<nexus-wizard-chrome
  title="Add print profile"
  [steps]="steps"
  [index]="index()"
  [actions]="actions()"
  [showProgress]="index() > 0"
  (back)="back()"
  (act)="onAction($event)"
  (cancel)="cancel()"
>
  @switch (index()) {
    @case (0) {
      <div class="wz-step wz-routes">
        <h3 class="wz-routes__ask">How would you like to start this profile?</h3>

        <nexus-wizard-route
          icon="grid-plus"
          title="Start from scratch"
          description="A balanced 0.20 mm profile, with sensible walls, infill and supports."
          (activate)="startFromScratch()"
        />

        <nexus-wizard-route
          icon="menu-scale"
          title="Start from a vendor preset"
          description="Profiles tuned for a particular printer and material."
          mode="expand"
          [open]="presetsOpen()"
          (activate)="togglePresets()"
        >
          <nexus-catalog-picker
            [entries]="catalogEntries()"
            [loading]="catalogStatus() === 'loading'"
            [unavailable]="catalogStatus() === 'unavailable'"
            [importingId]="importingId()"
            [importError]="importError()"
            [hasMore]="catalogHasMore()"
            [loadingMore]="catalogLoadingMore()"
            actionLabel="Use preset"
            (pick)="startFromCatalog($event)"
            (retry)="retryCatalog()"
            (search)="onCatalogSearch($event)"
            (loadMore)="loadMoreCatalog()"
          />
        </nexus-wizard-route>
      </div>
    }

    @case (1) {
      <div class="wz-step wz-done">
        <p class="wz-done__kicker">Ready to slice with</p>
        <nexus-wizard-name
          [value]="draft().name"
          ariaLabel="Profile name"
          placeholder="Name your profile"
          (valueChange)="patch({ name: $event })"
        />
        <p class="wz-done__sub">
          Walls, infill, speeds and supports live in its settings. You can change them later.
        </p>

        <nexus-field-row
          label="Quality"
          description="A label for sorting. It changes no setting."
          [stacked]="true"
        >
          <nexus-segmented
            [options]="qualityOptions"
            [value]="draft().quality ?? 'standard'"
            (valueChange)="setQuality($event)"
          />
        </nexus-field-row>
        <nexus-field-row
          label="Layer height"
          description="Drives print time and how visible the layers are."
        >
          <nexus-number-input
            [value]="pnum(draft().params, 'layer_height')"
            [min]="0.04"
            [max]="1"
            [step]="0.02"
            unit="mm"
            (valueChange)="patchParams({ layer_height: $event })"
          />
        </nexus-field-row>
      </div>
    }
  }
</nexus-wizard-chrome>
