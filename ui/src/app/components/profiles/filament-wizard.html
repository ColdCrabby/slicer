<nexus-wizard-chrome
  title="Add filament"
  [steps]="steps"
  [index]="index()"
  [actions]="actions()"
  [showProgress]="index() > 0"
  (back)="back()"
  (act)="onAction($event)"
  (cancel)="cancel()"
>
  @switch (index()) {
    @case (0) {
      <div class="wz-step wz-routes">
        <h3 class="wz-routes__ask">How would you like to start this spool?</h3>

        <nexus-wizard-route
          icon="grid-plus"
          title="Start from scratch"
          description="A generic spool. Choosing a material sets its temperatures for you."
          (activate)="startFromScratch()"
        />

        <nexus-wizard-route
          icon="droplet"
          title="Start from a vendor preset"
          description="Spools already tuned by their vendor."
          mode="expand"
          [open]="presetsOpen()"
          (activate)="togglePresets()"
        >
          <nexus-catalog-picker
            [entries]="catalogEntries()"
            [loading]="catalogStatus() === 'loading'"
            [unavailable]="catalogStatus() === 'unavailable'"
            [importingId]="importingId()"
            [importError]="importError()"
            [hasMore]="catalogHasMore()"
            [loadingMore]="catalogLoadingMore()"
            actionLabel="Use preset"
            (pick)="startFromCatalog($event)"
            (retry)="retryCatalog()"
            (search)="onCatalogSearch($event)"
            (loadMore)="loadMoreCatalog()"
          />
        </nexus-wizard-route>
      </div>
    }

    @case (1) {
      <div class="wz-step wz-done">
        <p class="wz-done__kicker">Ready to print with</p>
        <div class="wz-done__named">
          <nexus-color-picker
            [value]="draft().color"
            ariaLabel="Filament colour"
            (valueChange)="patchColor($event)"
          />
          <nexus-wizard-name
            [value]="draft().name"
            ariaLabel="Filament name"
            placeholder="Name your spool"
            (valueChange)="patch({ name: $event })"
          />
        </div>
        <p class="wz-done__sub">
          Temperatures and cooling follow the material. You can change them later.
        </p>

        <nexus-field-row label="Vendor" [stacked]="true">
          <input class="wz-input" [value]="draft().vendor" (input)="patchVendor($event)" />
        </nexus-field-row>
        <nexus-field-row
          label="Material"
          description="Sets the temperatures and how hard the part fan runs."
        >
          <nexus-select
            [options]="materialOptions"
            [value]="draft().material"
            (valueChange)="setMaterial($event)"
          />
        </nexus-field-row>
        <nexus-field-row
          label="Filament diameter"
          description="1.75 mm unless yours takes 2.85 mm."
        >
          <nexus-number-input
            [value]="pnum(draft().params, 'filament_diameter_mm')"
            [min]="1"
            [max]="4"
            [step]="0.05"
            unit="mm"
            (valueChange)="patchParams({ filament_diameter_mm: $event })"
          />
        </nexus-field-row>
      </div>
    }
  }
</nexus-wizard-chrome>
