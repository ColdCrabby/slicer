<section class="settings-panel">
  <div class="preset-bar">
    <nexus-label-filter-bar
      class="preset-filter"
      [selectedIds]="labelFilter.selectedIds()"
      (toggle)="labelFilter.toggle($event)"
      (clear)="labelFilter.clear()"
    />

    <!--
      What this plate is made of, all three at once.
      
      It used to be a row of tabs over a single preset picker, which showed one
      third of the answer and made you click to see the rest — on a page whose
      first question is "what am I printing this with?". The tabs are gone: the
      row you are working in *is* the one you last touched, and the other two
      stay legible above and below it rather than hiding behind it.
    -->
    <div class="recipe">
      <div class="recipe-head">
        <span class="recipe-title">This plate</span>

        <!--
          Plate-wide, which is why it sits with the plate's own label rather
          than on any one row. Always here, quiet when there is nothing to sync,
          so it never arrives under a cursor that was reaching for something
          else.
        -->
        <button
          nexusIconButton
          class="sync-trigger"
          variant="outline"
          [disabled]="modifiedCount() === 0"
          [tooltip]="syncTooltip()"
          [attr.aria-label]="syncTooltip()"
          (click)="syncToProfile()"
        >
          <nexus-icon name="floppy-disk-arrow-out" />
          @if (modifiedCount() > 0) {
            <span class="sync-trigger-count">{{ modifiedCount() }}</span>
          }
        </button>
      </div>

      @for (contract of contracts; track contract.id) {
        <!--
          Reaching for a row is what scopes the settings to it — one gesture,
          not a tab press and then a pick. `mousedown` so the scope has already
          changed by the time the preset list opens over it.
        -->
        <div
          class="recipe-row"
          [class.is-active]="activeContract() === contract.id"
          (mousedown)="setContract(contract.id)"
        >
          @if (presetOptionsFor(contract.id).length > 0) {
            <nexus-select
              class="recipe-select"
              [options]="presetOptionsFor(contract.id)"
              [value]="selectedIdFor(contract.id)"
              [startIcon]="contract.icon"
              [placeholder]="'Select ' + contract.label.toLowerCase()"
              (valueChange)="selectPresetFor(contract.id, $event)"
            />
          } @else {
            <a class="preset-empty" [routerLink]="contract.managePath">
              <nexus-icon [name]="contract.icon" aria-hidden="true" />
              Add a {{ contract.label.toLowerCase() }} preset…
            </a>
          }

          <a
            nexusIconButton
            class="recipe-edit"
            [routerLink]="contract.managePath"
            [queryParams]="editParamsFor(contract.id)"
            [attr.aria-label]="editLabelFor(contract.id)"
            [tooltip]="editLabelFor(contract.id)"
          >
            <nexus-icon name="settings" />
          </a>
        </div>
      }
    </div>
  </div>

  <se-schema-form
    class="settings-form"
    [schema]="schema"
    [value]="settings()"
    [modifiedKeys]="modifiedKeys()"
    [machineCorrectedKeys]="machineMaterialKeys()"
    [machineCorrectionLabel]="machineMaterialLabel()"
    [visibleGroups]="activeGroups()"
    [groupIcons]="groupIcons"
    (fieldChange)="update($event)"
  />

  @if (footerVisible()) {
    <footer #footer class="settings-footer" [class.is-error]="saveIsError()">
      <!-- The dot keeps its space whether or not it is showing: this strip sits
           under the user's cursor while they drag a slider, and a dot that
           appears mid-save would shove the text sideways on every edit. -->
      <span class="settings-footer-dot" [class.is-active]="saveVisible()"></span>
      <span class="settings-footer-text" [title]="footerTitle()">{{ footerLabel() }}</span>
      @if (modifiedCount()) {
        <button
          type="button"
          class="settings-footer-reset"
          [class.is-confirming]="resetConfirming()"
          (click)="resetOverrides()"
          (blur)="cancelReset()"
        >
          {{ resetConfirming() ? 'Confirm?' : 'Reset all' }}
        </button>
      }
      <!-- Only the save result is announced. The change count updates on every
           keystroke and would turn a screen reader into a metronome. -->
      <span class="settings-footer-announce" role="status" aria-live="polite">{{
        saveVisible() ? saveLabel() : ''
      }}</span>
    </footer>
  }
</section>
