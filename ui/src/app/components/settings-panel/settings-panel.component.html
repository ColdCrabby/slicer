<section class="settings-panel">
  <div class="preset-bar" #presetBar>
    <div class="preset-tools">
      <nexus-label-filter-bar
        class="preset-filter"
        [selectedIds]="labelFilter.selectedIds()"
        (toggle)="labelFilter.toggle($event)"
        (clear)="labelFilter.clear()"
      />

      <!--
        Plate-wide, so it shares the plate-wide row rather than owning one.
        Always here and quiet at zero, so it never arrives under a cursor that
        was reaching for something else.
      -->
      <!--
        Saving is the one thing here with no action attached, so it is a dot
        rather than a sentence: present while it has something to report, and
        holding its space so the buttons beside it never shift.
      -->
      <span
        class="save-dot"
        [class.is-active]="saveVisible()"
        [class.is-error]="saveIsError()"
        [title]="footerTitle()"
      ></span>

      <!--
        Reverting and syncing are the same subject — what this plate has changed
        — so they sit together, and next to the count that says how much there
        is. They used to live in a strip at the very bottom of the panel, a
        scroll away from the settings that caused them.
      -->
      <button
        type="button"
        class="revert-trigger"
        [class.is-confirming]="resetConfirming()"
        [disabled]="modifiedCount() === 0"
        [tooltip]="revertTooltip()"
        [attr.aria-label]="revertTooltip()"
        (click)="resetOverrides()"
        (blur)="cancelReset()"
      >
        <nexus-icon [name]="resetConfirming() ? 'warning-triangle' : 'undo'" />
      </button>

      <button
        nexusIconButton
        class="sync-trigger"
        variant="outline"
        [disabled]="modifiedCount() === 0"
        [tooltip]="syncTooltip()"
        [attr.aria-label]="syncTooltip()"
        (click)="syncToProfile()"
      >
        <nexus-icon name="upload" />
        @if (modifiedCount() > 0) {
          <span class="sync-trigger-count">{{ modifiedCount() }}</span>
        }
      </button>
    </div>

    <!--
      What this plate is made of, all three at once.
      
      It used to be a row of tabs over a single preset picker, which showed one
      third of the answer and made you click to see the rest — on a page whose
      first question is "what am I printing this with?". The tabs are gone: the
      row you are working in *is* the one you last touched, and the other two
      stay legible above and below it rather than hiding behind it.
    -->
    <div class="recipe">
      @for (contract of contracts; track contract.id) {
        <!--
          Two intentions, two targets. Pointing the settings at a row is the
          frequent one, so it gets the whole row; swapping the preset is rarer
          and gets the caret beside it.

          They were one control for a while — the row was the picker, and
          scoping meant opening a preset list you then had to dismiss. Switching
          between printer and process settings is something you do constantly,
          and it should not cost a menu every time.
        -->
        <div class="recipe-row" [class.is-active]="activeContract() === contract.id">
          <button
            type="button"
            class="recipe-scope"
            [attr.aria-pressed]="activeContract() === contract.id"
            (click)="setContract(contract.id)"
          >
            <nexus-icon [name]="contract.icon" aria-hidden="true" />
            <span class="recipe-name">{{ presetNameFor(contract.id) }}</span>
          </button>

          @if (presetOptionsFor(contract.id).length > 0) {
            <!-- Trigger label is clipped, not removed: the caret is all that
                 shows, and a screen reader still hears which preset it holds. -->
            <span class="recipe-swap-wrap">
              <nexus-select
                class="recipe-swap"
                [options]="presetOptionsFor(contract.id)"
                [value]="selectedIdFor(contract.id)"
                [placeholder]="'Select ' + contract.label.toLowerCase()"
                (valueChange)="selectPresetFor(contract.id, $event)"
              />
              <nexus-icon class="recipe-swap-icon" name="list-select" aria-hidden="true" />
            </span>
          }

          <a
            nexusIconButton
            class="recipe-edit"
            [routerLink]="contract.managePath"
            [queryParams]="editParamsFor(contract.id)"
            [attr.aria-label]="editLabelFor(contract.id)"
            [tooltip]="editLabelFor(contract.id)"
          >
            <nexus-icon name="page-edit" />
          </a>
        </div>
      }
    </div>
  </div>

  <se-schema-form
    class="settings-form"
    [schema]="schema"
    [value]="settings()"
    [modifiedKeys]="modifiedKeys()"
    [machineCorrectedKeys]="machineMaterialKeys()"
    [machineCorrectionLabel]="machineMaterialLabel()"
    [visibleGroups]="activeGroups()"
    [groupIcons]="groupIcons"
    (fieldChange)="update($event)"
  />

  <!-- Only the save result is announced. The change count updates on every
       keystroke and would turn a screen reader into a metronome. -->
  <span class="settings-announce" role="status" aria-live="polite">{{
    saveVisible() ? saveLabel() : ''
  }}</span>
</section>
