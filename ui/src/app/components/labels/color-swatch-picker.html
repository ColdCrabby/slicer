<div class="picker">
  <div class="picker__row">
    <div class="picker__hues" role="listbox" aria-label="Hue">
      @for (h of hues; track h.value) {
        <button
          type="button"
          class="picker__hue"
          role="option"
          [class.is-selected]="h.value === hue()"
          [style.--label-color]="h.value"
          [attr.aria-selected]="h.value === hue()"
          [attr.aria-label]="h.name"
          [attr.title]="h.name"
          (click)="pickHue(h.value)"
        >
          @if (h.value === hue()) {
            <nexus-icon name="check" />
          }
        </button>
      }
    </div>

    <div class="picker__tones" role="group" aria-label="Shade">
      <button
        type="button"
        class="picker__tone"
        [class.is-active]="tone() === 'dark'"
        (click)="pickTone('dark')"
      >
        Dark
      </button>
      <button
        type="button"
        class="picker__tone"
        [class.is-active]="tone() === 'light'"
        (click)="pickTone('light')"
      >
        Light
      </button>
    </div>
  </div>

  <div class="picker__preview">
    <span class="picker__preview-label">Preview</span>
    <nexus-label-chip [label]="previewLabel" />
  </div>
</div>
