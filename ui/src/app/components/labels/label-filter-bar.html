@if (store.count() > 0) {
  <div class="fb">
    <nexus-icon name="filter" class="fb__icon" />
    <div class="fb__chips">
      @for (label of store.items(); track label.id) {
        <button
          type="button"
          class="fb__chip"
          [class.is-on]="isSelected(label.id)"
          [attr.data-tone]="label.tone"
          [style.--label-color]="label.color"
          [attr.aria-pressed]="isSelected(label.id)"
          (click)="toggle.emit(label.id)"
        >
          <span class="fb__dot"></span>
          {{ label.name }}
        </button>
      }
    </div>
    @if (hasSelection()) {
      <button type="button" class="fb__clear" (click)="clear.emit()">Clear</button>
    }
  </div>
}
