<div class="wp-tablist" role="tablist" aria-label="Open workplates">
  @for (tab of tabs(); track tab.uuid; let i = $index) {
    <div
      #tabEl
      class="wp-tab"
      role="tab"
      [class.active]="tab.uuid === activeUuid()"
      [attr.aria-selected]="tab.uuid === activeUuid()"
      [attr.tabindex]="tab.uuid === activeUuid() ? 0 : -1"
      (click)="activate(tab.uuid)"
      (dblclick)="startEditing(tab.uuid, $event)"
      (keydown)="onTabKeydown($event, tab.uuid, i)"
      (nexusContextMenu)="onContextMenu($event, tab.uuid)"
    >
      @if (editingUuid() === tab.uuid) {
        <input
          #editInput
          class="wp-tab-name wp-tab-name--editing"
          type="text"
          [value]="nameFor(tab)"
          [placeholder]="placeholderFor(tab)"
          (blur)="onInputBlur(tab.uuid, $event)"
          (keydown)="onInputKeydown(tab.uuid, $event, editInput)"
          (click)="$event.stopPropagation()"
          aria-label="Workplate name"
          spellcheck="false"
          autocomplete="off"
        />
      } @else {
        <span class="wp-tab-label" (dblclick)="startEditing(tab.uuid, $event)">
          {{ nameFor(tab) || placeholderFor(tab) }}
        </span>
      }
      <button
        nexusIconButton
        size="sm"
        class="wp-tab-close"
        type="button"
        tabindex="-1"
        [attr.aria-label]="'Close ' + (nameFor(tab) || placeholderFor(tab))"
        tooltip="Close"
        (click)="closeTab(tab.uuid, $event)"
      >
        <nexus-icon name="xmark" />
      </button>
    </div>
  }

  <!--
    The plate on screen before it has a `request_uuid` of its own. Without it the
    strip renders a tablist with nothing selected while the user is plainly
    working somewhere; it is replaced by a real tab the moment a model lands.
  -->
  @if (isNewPlate()) {
    <div class="wp-tab wp-tab--draft active" role="tab" aria-selected="true" tabindex="0">
      <span class="wp-tab-label">New plate</span>
    </div>
  }
</div>

<button
  nexusIconButton
  size="sm"
  class="wp-tab-add"
  type="button"
  aria-label="Open a new workplate"
  tooltip="New workplate"
  (click)="addTab()"
>
  <nexus-icon name="plus" />
</button>
