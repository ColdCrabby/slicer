<div
  #tablist
  class="wp-tablist"
  data-tauri-drag-region
  role="tablist"
  aria-label="Open plates"
  (wheel)="onStripWheel($event)"
>
  @for (tab of tabs(); track tab.uuid; let i = $index) {
    <div
      #tabEl
      class="wp-tab"
      role="tab"
      [attr.data-uuid]="tab.uuid"
      [class.active]="tab.uuid === activeUuid()"
      [attr.aria-selected]="tab.uuid === activeUuid()"
      [attr.tabindex]="tab.uuid === activeUuid() ? 0 : -1"
      (click)="activate(tab.uuid)"
      (dblclick)="startEditing(tab.uuid, $event)"
      (mousedown)="onTabMouseDown($event)"
      (auxclick)="onTabAuxClick(tab.uuid, $event)"
      (keydown)="onTabKeydown($event, tab.uuid, i)"
      (nexusContextMenu)="onContextMenu($event, tab.uuid)"
    >
      @if (editingUuid() === tab.uuid) {
        <input
          #editInput
          class="wp-tab-name wp-tab-name--editing"
          type="text"
          [value]="nameFor(tab)"
          [placeholder]="placeholderFor(tab)"
          [style.min-width.px]="editWidth()"
          [style.width.px]="editGrowWidth()"
          (blur)="onInputBlur(tab.uuid, $event)"
          (input)="onInputChanged(editInput)"
          (keydown)="onInputKeydown(tab.uuid, $event, editInput)"
          (click)="$event.stopPropagation()"
          aria-label="Plate name"
          spellcheck="false"
          autocomplete="off"
        />
      } @else {
        <span class="wp-tab-label" (dblclick)="startEditing(tab.uuid, $event)">
          {{ nameFor(tab) || placeholderFor(tab) }}
        </span>
      }
      <button
        nexusIconButton
        size="sm"
        class="wp-tab-close"
        type="button"
        tabindex="-1"
        [attr.aria-label]="'Close ' + (nameFor(tab) || placeholderFor(tab))"
        tooltip="Close"
        (click)="closeTab(tab.uuid, $event)"
      >
        <nexus-icon name="xmark" />
      </button>
    </div>
  }

  <!--
    The plate on screen before it has a `request_uuid` of its own — the
    dashboard the `+` opens, or the empty-plate drop screen. Without it the
    strip renders a tablist with nothing selected while the user is plainly
    working somewhere; it is replaced by a real tab the moment a model lands.
  -->
  @if (isNewPlate()) {
    <div
      class="wp-tab wp-tab--draft active"
      role="tab"
      aria-selected="true"
      tabindex="0"
      (click)="activateDraft()"
      (keydown.enter)="activateDraft()"
      (keydown.space)="activateDraft()"
    >
      <span class="wp-tab-label">New workplate</span>
    </div>
  }
</div>

<button
  nexusIconButton
  size="sm"
  class="wp-tab-add"
  type="button"
  aria-label="Open a new plate"
  tooltip="New plate"
  (click)="addTab()"
>
  <nexus-icon name="plus" />
</button>

<!--
  Only once there is something to search: with a single tab the strip already
  shows every workplate there is.
-->
@if (tabs().length > 1 || searchOpen()) {
  <button
    nexusIconButton
    size="sm"
    class="wp-tab-search"
    type="button"
    cdkOverlayOrigin
    #searchTrigger="cdkOverlayOrigin"
    aria-label="Search open workplates"
    aria-haspopup="listbox"
    [attr.aria-expanded]="searchOpen()"
    [class.is-open]="searchOpen()"
    tooltip="Search open workplates"
    [tooltipShortcut]="searchShortcut"
    (click)="toggleSearch()"
  >
    <nexus-icon name="nav-arrow-down" />
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="searchTrigger"
    [cdkConnectedOverlayOpen]="searchOpen()"
    [cdkConnectedOverlayPositions]="searchPositions"
    [cdkConnectedOverlayViewportMargin]="8"
    (overlayOutsideClick)="onSearchOutsideClick($event, searchTrigger)"
    (detach)="searchOpen.set(false)"
  >
    <nexus-workplate-tab-search
      [entries]="searchEntries()"
      [activeUuid]="activeUuid()"
      (pick)="pickFromSearch($event)"
      (closeTab)="closeTab($event)"
      (dismiss)="dismissSearch(searchTrigger)"
    />
  </ng-template>
}
