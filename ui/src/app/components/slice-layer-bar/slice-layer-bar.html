@if (preview.gcodeHandle() !== null) {
  <div class="layer-bar" (pointerdown)="$event.stopPropagation()">
    <!-- ── Layer info ── -->
    <div class="meta">
      <span class="num">{{ preview.layerMax() + 1 }}</span>
      <span class="total">/ {{ preview.layerCount() }}</span>
    </div>

    <!-- ── Step up (touch equivalent of ArrowUp) ── -->
    @if (showStepButtons()) {
      <button
        type="button"
        class="step-btn"
        aria-label="Next layer"
        [disabled]="preview.layerMax() >= preview.layerCount() - 1"
        (click)="preview.stepLayer(1)"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="18 15 12 9 6 15" />
        </svg>
      </button>
    }

    <!-- ── Vertical layer slider ──
         The native input is fully transparent and only ever used as the
         drag/keyboard hit target — its own thumb is never drawn. Every
         browser positions a vertical range's native thumb slightly
         differently (thumb geometry, `orient="vertical"` support), which
         used to leave the visible thumb a few pixels off from the fill it
         was supposed to track. Both the fill and the dot below are driven by
         the exact same `fillPercent()`, so they can never disagree. -->
    <div class="slider-wrap" (wheel)="onWheel($event)">
      <div class="track-bg">
        <div class="track-fill" [style.height.%]="fillPercent()"></div>
        <div class="track-thumb" [style.bottom.%]="fillPercent()" aria-hidden="true"></div>
        @for (marker of triggerMarkers(); track marker.layerIndex) {
          <button
            type="button"
            class="trigger-marker"
            [style.bottom.%]="marker.percent"
            [title]="'Trigger on layer ' + (marker.layerIndex + 1) + ' — click to select'"
            (pointerdown)="$event.stopPropagation()"
            (click)="selectTriggerLayer(marker.layerIndex)"
          ></button>
        }
      </div>
      <input
        type="range"
        class="layer-input"
        min="0"
        [max]="preview.layerCount() - 1"
        [value]="preview.layerMax()"
        (input)="onInput($event)"
        orient="vertical"
      />
    </div>

    <!-- ── Step down (touch equivalent of ArrowDown) ── -->
    @if (showStepButtons()) {
      <button
        type="button"
        class="step-btn"
        aria-label="Previous layer"
        [disabled]="preview.layerMax() <= 0"
        (click)="preview.stepLayer(-1)"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    }

    <!-- ── Pause / color-change triggers ── -->
    <div class="trigger-controls">
      @if (currentLayerHasTrigger()) {
        <button
          type="button"
          class="trigger-btn remove"
          title="Remove trigger on this layer"
          (click)="removeCurrentTrigger()"
        >
          −
        </button>
      } @else {
        <button
          type="button"
          class="trigger-btn"
          title="Add pause at this layer"
          (click)="addTrigger('pause')"
        >
          ⏸
        </button>
        <button
          type="button"
          class="trigger-btn"
          title="Add color change at this layer"
          (click)="addTrigger('color_change')"
        >
          ⛃
        </button>
      }
    </div>

    <!-- ── Show-all vs current-only toggle ── -->
    <button
      type="button"
      class="mode-btn"
      [class.active]="preview.showAllLayers()"
      [attr.aria-pressed]="preview.showAllLayers()"
      (click)="toggleMode()"
      [title]="
        preview.showAllLayers()
          ? 'Showing all layers — click to show current only'
          : 'Showing current layer only — click to show all from bottom'
      "
    >
      @if (preview.showAllLayers()) {
        <!-- layers-stack icon -->
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
      } @else {
        <!-- single-layer icon -->
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
        </svg>
      }
    </button>
  </div>
}
