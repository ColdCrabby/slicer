@for (entry of entries(); track entry.version) {
  <section class="whats-new__release">
    <header class="whats-new__release-header">
      <h3 class="whats-new__version">{{ entry.version }}</h3>
      @if (entry.date) {
        <span class="whats-new__date">{{ entry.date }}</span>
      }
    </header>
    <markdown class="whats-new__body" [data]="entry.body"></markdown>
  </section>
} @empty {
  <p class="whats-new__empty">No release notes available.</p>
}
