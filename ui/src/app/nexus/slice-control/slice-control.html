<div class="slice-block">
  <div class="slice-row">
    <div class="file-info">
      @if (slicer.selectedFile()) {
        <nexus-icon name="cube-scan"></nexus-icon>
        <span class="file-name" [tooltip]="slicer.selectedFile()!.name">
          {{ slicer.selectedFile()!.name }}
        </span>
      } @else {
        <nexus-icon name="cube-scan" class="muted"></nexus-icon>
        <span class="no-file">No model loaded</span>
      }
    </div>

    @if (showActions()) {
      <div class="send-split" [class.is-open]="menuOpen()">
        <button
          class="send-action"
          type="button"
          [tooltip]="primaryTooltip()"
          (click)="runPrimary()"
        >
          <nexus-icon [name]="primaryIcon()"></nexus-icon>
        </button>
        <button
          class="send-caret"
          type="button"
          #caret
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          tooltip="Choose action"
          (click)="toggleMenu()"
        >
          <nexus-icon name="nav-arrow-down"></nexus-icon>
        </button>
      </div>
    }

    <button
      class="slice-btn"
      type="button"
      [class.is-busy]="isActive()"
      [class.is-stale]="isStale()"
      [disabled]="!canSlice()"
      [tooltip]="ctaTooltip()"
      (click)="slice()"
    >
      @if (!isActive()) {
        <nexus-icon name="play"></nexus-icon>
      }
      {{ ctaLabel() }}
    </button>
  </div>

  <!-- Always rendered with a reserved height so the card never reflows. -->
  <div class="slice-status" [attr.data-state]="statusState()">
    @if (isStale()) {
      <span class="status-dot" aria-hidden="true"></span>
    }
    {{ statusLine() }}
  </div>

  <!-- Progress rail pinned flush to the shared card's bottom edge (no layout shift). -->
  <div
    class="slice-progress-rail"
    [class.is-visible]="showProgress()"
    [class.is-done]="isDone()"
    [class.is-error]="isError()"
    [class.no-transition]="disableProgressTransition()"
    aria-hidden="true"
  >
    <div class="slice-progress-fill" [style.width.%]="slicer.sliceProgress()"></div>
  </div>
</div>

<ng-template #menuTpl>
  <div class="send-menu" role="menu">
    @for (action of actions(); track action.value) {
      <button
        type="button"
        role="menuitemradio"
        class="send-menu-item"
        [class.is-selected]="action.selected"
        [disabled]="!action.available"
        [attr.aria-checked]="action.selected"
        (click)="pick(action.value)"
      >
        <nexus-icon [name]="action.icon" class="send-menu-icon" aria-hidden="true" />
        <span class="send-menu-body">
          <span class="send-menu-label">{{ action.label }}</span>
          <span class="send-menu-desc">{{ action.description }}</span>
        </span>
        @if (action.selected) {
          <nexus-icon name="check" class="send-menu-check" aria-hidden="true" />
        }
      </button>
    }
  </div>
</ng-template>
