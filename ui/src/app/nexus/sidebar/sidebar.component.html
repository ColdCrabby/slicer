<div class="sidebar-header">
  <span class="sidebar-heading">
    <span class="sidebar-heading-icon"><nexus-icon name="menu-scale" /></span>
    @if (isExpanded()) {
      <span class="sidebar-heading-label">Print settings</span>
    }
  </span>

  <div class="sidebar-header-actions">
    @if (isExpanded()) {
      <nexus-connection-state />
    }
  </div>
</div>

<div class="sidebar-content">
  <div class="sidebar-content-inner">
    <ng-content />
  </div>
</div>

<div class="sidebar-footer">
  @if (isExpanded()) {
    <span class="sidebar-footer-spacer"></span>
  }

  @if (collapsed() && isExpanded()) {
    <button
      class="sidebar-footer-btn"
      type="button"
      [class.is-active]="pinnedOpen()"
      [attr.aria-pressed]="pinnedOpen()"
      [attr.aria-label]="pinnedOpen() ? 'Unpin sidebar' : 'Keep sidebar open'"
      (click)="onPinToggle($event)"
    >
      <nexus-icon name="pin" />
    </button>
  }

  <button
    class="sidebar-footer-btn"
    type="button"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="onCollapseToggle($event)"
  >
    @if (collapsed() && !isExpanded()) {
      <nexus-icon name="nav-arrow-right" />
    } @else if (collapsed() && isExpanded()) {
      <nexus-icon name="nav-arrow-right" />
    } @else {
      <nexus-icon name="nav-arrow-left" />
    }
  </button>
</div>

<div
  class="resize-handle"
  aria-hidden="true"
  (mousedown)="onResizeStart($event)"
  (touchstart)="onResizeTouchStart($event)"
></div>
