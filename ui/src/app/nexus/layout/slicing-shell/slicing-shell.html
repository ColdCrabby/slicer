<nexus-sidebar>
  <nexus-settings-panel />
</nexus-sidebar>

<main class="shell-content">
  <router-outlet></router-outlet>

  <div class="shell-actions-layer">
    <nexus-3d-view-toolbar class="shell-toolbar" />

    <div class="tool-dock">
      <nexus-transform-panel />
      <nexus-placement-panel />
      <nexus-paint-panel />
    </div>

    <nexus-objects-panel class="objects-dock" />

    <nexus-scene-notices class="scene-notify" />

    <nexus-viewport-cube class="viewport-cube" />

    <!-- Unified right rail: G-code inspector (top, grows upward) + slice dock (bottom). -->
    <nexus-card class="rail-card" visualSize="large">
      <nexus-slice-segment-bar />
      <nexus-slice-control />
    </nexus-card>
  </div>
</main>

<!-- A sibling of the scene, not an overlay on it: the text is read alongside
     the toolpath it describes, so it takes width rather than covering the
     thing the caret is pointing at. -->
@if (textPanelOpen()) {
  <nexus-gcode-text-panel class="text-panel" />
}
