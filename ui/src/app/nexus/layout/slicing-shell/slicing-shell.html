<nexus-sidebar>
  <nexus-settings-panel />
</nexus-sidebar>

<main class="shell-content" nexusPanel primary>
  <router-outlet></router-outlet>

  <div class="shell-actions-layer">
    <nexus-3d-view-toolbar class="shell-toolbar" />

    <div class="tool-dock">
      <nexus-transform-panel />
      <nexus-placement-panel />
      <nexus-paint-panel />
    </div>

    <nexus-objects-panel class="objects-dock" />

    <nexus-scene-notices class="scene-notify" />

    <nexus-viewport-cube class="viewport-cube" />

    <!-- Unified right rail: G-code inspector (top, grows upward) + slice dock (bottom). -->
    <nexus-card class="rail-card" visualSize="large">
      <nexus-slice-segment-bar />
      <nexus-slice-control />
    </nexus-card>
  </div>
</main>

<!-- The library opens from the rail, so it comes out of the rail's side: over
     the plate's left edge, and over the print settings while it is open. It is
     never docked — it is opened to put a model down and closed again.
     Resizable from its right edge, and loaded on first open, since most plates
     never ask. -->
@if (libraryFlyout.open()) {
  @defer (on immediate) {
    <div class="library-sheet" animate.enter="library-turn-in" animate.leave="library-turn-out">
      <nexus-library-flyout class="library-flyout" nexusPanel />
      <nexus-panel-resizer
        property="--library-w"
        storageKey="library.flyoutWidth"
        label="Resize the library"
        [min]="260"
        [max]="560"
      />
    </div>
  }
}

<!-- A panel beside the scene, not an overlay on it: the text is read
     alongside the toolpath it describes, so it takes width rather than
     covering the thing the caret is pointing at. -->
@if (textPanelOpen()) {
  <nexus-gcode-text-panel class="text-panel" nexusPanel />
}
