<nav class="rail-nav">
  @for (item of items; track item.path) {
    @let pending = isPending(item.path);
    @if (item.path === '/library' && onPlate()) {
      <button
        type="button"
        class="rail-item"
        [class.is-open]="libraryFlyout.open()"
        [attr.aria-label]="item.label"
        [attr.aria-expanded]="libraryFlyout.open()"
        (click)="libraryFlyout.toggle()"
      >
        <span class="rail-icon">
          <nexus-icon [name]="item.icon" />
        </span>
        <span class="rail-label">{{ item.label }}</span>
      </button>
    } @else {
      <a
        class="rail-item"
        [class.is-pending]="pending"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.aria-label]="item.label"
        [attr.aria-busy]="pending ? 'true' : null"
      >
        <span class="rail-icon">
          <nexus-icon [name]="item.icon" />
          @if (pending) {
            <span class="rail-spinner" aria-hidden="true"></span>
          }
        </span>
        <span class="rail-label">{{ item.label }}</span>
      </a>
    }
  }
</nav>
