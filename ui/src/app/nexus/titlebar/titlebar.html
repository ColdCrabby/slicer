<div class="tb-leading" data-tauri-drag-region>
  <span class="tb-brand">
    <nexus-logo [hideProductName]="hideProductName()" />
  </span>
</div>

<nexus-workplate-tabs class="tb-workplate" />

<div class="tb-spacer" data-tauri-drag-region></div>

<div class="tb-status">
  <a
    nexusIconButton
    size="sm"
    class="tb-docs"
    href="https://slicer.maxscopp.de/docs/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open the documentation site"
    tooltip="Documentation"
  >
    <nexus-icon name="open-book" />
  </a>
  <a
    nexusIconButton
    size="sm"
    class="tb-github"
    href="https://github.com/ColdCrabby/slicer"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open the Slicer repository on GitHub"
    tooltip="View source"
  >
    <nexus-icon name="github" />
  </a>
  @if (apiDocsUrl(); as apiDocs) {
    <a
      nexusIconButton
      size="sm"
      class="tb-api"
      [href]="apiDocs"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open this slicer's API reference"
      tooltip="API reference"
    >
      <nexus-icon name="code-brackets" />
    </a>
  }
  <a
    nexusIconButton
    size="sm"
    class="tb-catalog"
    href="https://cloud-presets.onrender.com/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open the preset catalog website"
    tooltip="Browse catalog"
  >
    <nexus-icon name="cloud" />
  </a>
  <a
    nexusIconButton
    size="sm"
    class="tb-sponsor"
    href="https://github.com/sponsors/max-scopp"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Sponsor Max Scopp on GitHub"
    tooltip="Support my work"
  >
    <nexus-icon name="heart" />
  </a>

  <nexus-connection-state></nexus-connection-state>
</div>

@if (showWindowControls()) {
  <div class="tb-controls">
    <button nexusIconButton size="sm" aria-label="Minimize" (click)="minimize()">
      <nexus-icon name="minus" />
    </button>
    <button
      nexusIconButton
      size="sm"
      [attr.aria-label]="maximized() ? 'Restore' : 'Maximize'"
      (click)="toggleMaximize()"
    >
      <nexus-icon [name]="maximized() ? 'collapse' : 'expand'" />
    </button>
    <button nexusIconButton size="sm" class="tb-close" aria-label="Close" (click)="close()">
      <nexus-icon name="xmark" />
    </button>
  </div>
}
