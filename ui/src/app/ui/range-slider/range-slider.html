<div
  class="range"
  [class.is-disabled]="disabled()"
  [style.--low]="lowPercent()"
  [style.--high]="highPercent()"
>
  <div class="track"></div>
  <div class="fill"></div>
  <input
    type="range"
    class="thumb"
    [class.on-top]="lowOnTop()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="low()"
    [disabled]="disabled()"
    [attr.aria-label]="(label() || 'Range') + ' minimum'"
    (pointerdown)="activeThumb.set('low')"
    (input)="onLowInput($any($event.target))"
  />
  <input
    type="range"
    class="thumb"
    [class.on-top]="activeThumb() === 'high'"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="high()"
    [disabled]="disabled()"
    [attr.aria-label]="(label() || 'Range') + ' maximum'"
    (pointerdown)="activeThumb.set('high')"
    (input)="onHighInput($any($event.target))"
  />
</div>

@if (showValue()) {
  <output class="readout">{{ low() }}{{ unit() }} – {{ high() }}{{ unit() }}</output>
}
