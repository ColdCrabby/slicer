<div class="cm" role="menu">
  @for (item of items(); track $index) {
    @if (item.separator) {
      <div class="cm-sep" role="separator"></div>
    } @else {
      <!--
        Each row is its own positioning context, so a flyout anchors to the row
        that opened it rather than to the top of the panel.
      -->
      <div class="cm-row" (mouseenter)="onHover(item)">
        <button
          type="button"
          [attr.role]="roleFor(item)"
          [attr.aria-checked]="item.checked === undefined ? null : item.checked"
          [attr.aria-haspopup]="hasFlyout(item) ? 'menu' : null"
          [attr.aria-expanded]="hasFlyout(item) ? openItem() === item : null"
          class="cm-item"
          [class.cm-item--danger]="item.danger"
          [class.is-open]="openItem() === item"
          [disabled]="item.disabled"
          (click)="onItem(item)"
          (focus)="onHover(item)"
        >
          @if (item.checked !== undefined) {
            <!--
              Rendered ticked or not, so a list of toggles keeps one text column
              instead of shifting as items check and uncheck.
            -->
            <span class="cm-check" aria-hidden="true">
              @if (item.checked) {
                <nexus-icon name="check" />
              }
            </span>
          } @else if (item.icon) {
            <span class="cm-icon"><nexus-icon [name]="item.icon" /></span>
          }
          <span class="cm-label">{{ item.label }}</span>
          @if (hasFlyout(item)) {
            <span class="cm-arrow" aria-hidden="true"><nexus-icon name="nav-arrow-right" /></span>
          }
        </button>

        @if (hasFlyout(item) && openItem() === item) {
          <div class="cm-sub" [class.cm-sub--flip]="flipped()">
            @if (item.submenuPanel) {
              <ng-container #panelHost />
            } @else {
              <nexus-context-menu [items]="item.submenu ?? []" (choose)="choose.emit($event)" />
            }
          </div>
        }
      </div>
    }
  }
</div>
