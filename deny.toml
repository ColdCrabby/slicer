# cargo-deny configuration — https://embark.github.io/cargo-deny/
#
# `.github/workflows/security.yml` runs:
#   * `cargo deny check bans sources`        (gate — policy is under our control)
#   * `cargo deny check advisories licenses` (report-first — volatile feeds)

[advisories]
# Add triaged/accepted advisory IDs here to silence known-and-accepted findings,
# e.g. ignore = ["RUSTSEC-2024-0001"].
ignore = []

[bans]
# Duplicate transitive versions are extremely common in large trees; warn so the
# gate stays actionable instead of perpetually red.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Permissive OSS licenses we accept. This check runs report-first, so an
# unlisted license surfaces as a finding rather than blocking a merge. Extend
# the list (or add per-crate `exceptions`) as the dependency tree grows.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[sources]
# Only crates.io is expected; flag anything pulled from an unknown registry or
# git remote so a typo-squat / unexpected source can't slip in unnoticed.
unknown-registry = "warn"
unknown-git = "warn"
