[package]
name = "slicer-engine"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "slicer-engine"

[features]
default = []
web-slicer = ["dep:clipper2", "dep:boostvoronoi"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars = "1.2.1"
stl_io = "0.11"
quick-xml = { version = "0.42", features = ["serialize"] }
dirs = "6.0.0"
toml = { version = "1.1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.33", features = ["serde"] }
thiserror = "2.0"
serde_bytes = "0.11"
tobj = "4.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clipper2 = "0.6"
boostvoronoi = "0.12"
rayon = "1.10"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "multipart",
    "query",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "io-util",
] }

# Host-only dependencies: every native target *except* iOS.
#
# iOS links the slicing engine but never the `cli`, `server` or `db` modules —
# a sandboxed mobile app has no command line and must not bind a listener, and
# the Tauri shell talks to the engine through `tauri::invoke` instead. Keeping
# actix-web, sea-orm/sqlx and clap out of the iOS link is what makes the mobile
# build tractable: it drops hundreds of crates (and their C dependencies) that
# would otherwise have to cross-compile for `aarch64-apple-ios*` for no gain.
# Mirrored by the module `cfg`s in `src/lib.rs` — change both together.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sea-orm = { version = "2.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
] }
sea-orm-migration = { version = "2.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
actix-web = "4.13"
actix-files = "0.7"
actix-ws = "0.4"
actix-multipart = "0.8.1"
actix-cors = "0.7"
base64 = "0.23"
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
clipper2 = { version = "0.5", optional = true }
boostvoronoi = { version = "0.12", optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
tempfile = "3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.dev]
opt-level = 1

# boostvoronoi's robust-predicate arithmetic trips thousands of
# `debug_assert!(…is_finite())` panics on curved slices in debug builds. They are
# caught per-region (see walls/arachne/generate.rs::build_voronoi_safe), but each
# one is an expensive unwind, floods stderr, and — by dropping that region's medial
# gap fill — makes debug output non-deterministic and diverge from release. The code
# runs clean in release (assertions compiled out), so build just this dependency
# optimized with assertions off even in dev, matching release behaviour.
[profile.dev.package.boostvoronoi]
opt-level = 3
debug-assertions = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Note: Use `cargo build` for fast dev builds
# Use `cargo build --release` only for CI/distribution

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true

# clipper2c-sys 0.1.6 panics on wasm32-unknown-unknown (target_os = "unknown").
# The fork adds a `("unknown", _) => {}` arm to skip stdlib linking on WASM,
# since the C++ stdlib is compiled into libclipper2c.a by the WASI SDK toolchain.
# Fork: https://github.com/max-scopp/clipper2c-sys branch fix/wasm-build
[patch.crates-io]
clipper2c-sys = { git = "https://github.com/max-scopp/clipper2c-sys", rev = "93cfeb1ec0508158ee2708bd114b678b90c836c7" }
