[package]
name = "slicer-ui-desktop"
version = "0.1.0"
edition = "2021"

# The app lives in a library so mobile can link it.
#
# iOS/Android have no Rust `main`: the generated Xcode/Gradle project links a
# static (iOS) or shared (Android) library and calls the `start_app` symbol that
# `tauri::mobile_entry_point` exports from `run()`. `rlib` keeps the desktop
# binary in `src/main.rs` able to depend on it as a normal crate.
[lib]
name = "slicer_ui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.bundle]
name = "Cold Crabby Desktop"
identifier = "com.maxscopp.slicerengine"
icon = [
    "icons/icon.ico",
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/256x256.png",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
slicer-engine = { path = "../../" }

# Cargo only honours `[profile.*]` from the root of the build graph, and this
# crate — not `slicer-engine` — is that root for the desktop app. Without these
# the engine's own profile tuning in the workspace `Cargo.toml` is ignored, so
# native slicing here builds slower than the cloud/server build of the same
# engine. Mirror the engine profiles so desktop slicing performance matches:
#   - dev: opt-level 1 (fast iteration) with boostvoronoi optimized + assertions
#     off (its robust-predicate arithmetic otherwise trips thousands of expensive
#     debug_assert unwinds on curved slices, flooding stderr and diverging output)
#   - release: LTO + single codegen unit, matching the distributed cloud build
[profile.dev]
opt-level = 1

[profile.dev.package.boostvoronoi]
opt-level = 3
debug-assertions = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
