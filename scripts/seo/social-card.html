<!doctype html>
<!--
  social-card.html — the source of social-card.png, the 1200×630 picture a link
  to the site unfurls into. Edit this, never the PNG, then re-render it from the
  repository root (needs `pnpm install` for the typeface):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$PWD/scripts/seo/social-card.png" "file://$PWD/scripts/seo/social-card.html"

  If the words change, change `socialCard.alt` in site.mjs with them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('../../ui/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      /* The app's light canvas, text and accent — the literals the boot splash
         in ui/src/index.html uses, for the same reason: no tokens load here. */
      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 0 64px 0 96px;
        background: #f4f5f8;
        color: #111214;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .words {
        flex: 1;
      }
      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      p {
        margin: 28px 0 0;
        font-size: 42px;
        font-weight: 500;
        line-height: 1.22;
        letter-spacing: -0.015em;
      }
      .detail {
        margin-top: 40px;
        font-size: 27px;
        line-height: 1.4;
        color: rgba(17, 18, 20, 0.6);
      }
      .address {
        margin-top: 10px;
        font-size: 27px;
        font-weight: 650;
        color: #e0730f;
      }
      img {
        flex: none;
        width: 430px;
      }
    </style>
  </head>
  <body>
    <div class="words">
      <h1>Cold Crabby</h1>
      <p>A 3D printer slicer<br />that runs in your browser.</p>
      <div class="detail">STL, OBJ and 3MF to G-code.<br />No install, no account.</div>
      <div class="address">slicer.maxscopp.de</div>
    </div>
    <img src="../../ui/public/logo_source.png" alt="" />
  </body>
</html>
